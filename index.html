<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta property="og:title" content="TrainStation Classic Add Friends Network">
    <meta property="og:type" content="website">
    <meta property="og:description" content="Find friends for TrainStation Classic. Updated daily!">
    <meta property="og:image" content="https://olligtrainstationclassic.github.io/preview.png">
    <meta property="og:url" content="https://olligtrainstationclassic.github.io/">

    <title>Trainstation Add Friends Network</title>

    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <meta name="theme-color" content="#0a0c10">

    <!-- Tabulator & Google Fonts -->
    <link href="https://unpkg.com/tabulator-tables@5.5.0/dist/css/tabulator_midnight.min.css" rel="stylesheet">
    <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/tabulator-tables@5.5.0/dist/js/tabulator.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

     <style>
        :root {
            --primary: #00d1ff;
            --bg-dark: #0a0c10;
            --panel-bg: #161b22;
            --border-glow: 0 0 10px rgba(0, 209, 255, 0.4);
            --muted: #8aa0b2;
        }

        body {
            background-color: var(--bg-dark);
            color: #e6edf3;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            overflow-x: hidden;
        }

        /* Header */
        .header-container {
            background: linear-gradient(rgba(10, 12, 16, 0.6), rgba(10, 12, 16, 0.6)), 
                        radial-gradient(circle at center, #1c2128 0%, #0a0c10 100%);
            border-bottom: 1px solid var(--primary);
            box-shadow: var(--border-glow);
            text-align: center;
            padding: 20px 0;
        }
        .header-img {
            max-height: 120px;
            filter: drop-shadow(0 0 15px var(--primary));
        }

        .topbar {
            background: var(--panel-bg);
            padding: 15px;
            border-bottom: 1px solid #30363d;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .explanation-text {
            color: var(--primary);
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0;
        }

        .messenger-inline-btn {
            background: transparent;
            color: #fff !important;
            border: 1px solid var(--primary);
            padding: 5px 15px;
            border-radius: 4px;
            transition: all 0.3s;
            box-shadow: var(--border-glow);
            text-decoration: none;
            font-size: 12px;
            margin-left: 10px;
        }

                .messenger-inline-btn:hover {
            background: var(--primary);
            color: #000 !important;
        }

        .search-info-wrapper {
            display: flex;
            align-items: center;
            gap: 20px;
            width: 100%;
            max-width: 800px;
        }

        input#search {
            background: #0d1117;
            color: var(--primary);
            border: 1px solid #30363d;
            border-radius: 20px;
            padding: 10px 20px;
            flex-grow: 1;
            outline: none;
            transition: border 0.3s;
        }

            input#search:focus {
            border-color: var(--primary);
            box-shadow: var(--border-glow);
        }

        /* TABULATOR CORE FIXES */
        #table {
            background-color: var(--bg-dark);
            height: calc(100vh - 250px);
        }

        .tabulator {
            border: none !important;
            background-color: var(--bg-dark) !important;
        }

        /* Nur den Header Text Cyan machen */
        .tabulator-header {
            background-color: #0d1117 !important;
            border-bottom: 2px solid var(--primary) !important;
        }

        .tabulator-header .tabulator-col {
            background-color: #0d1117 !important;
            color: var(--primary) !important;
            font-family: 'Orbitron', sans-serif;
        }

        .tabulator-header .tabulator-col-title {
            color: var(--primary) !important;
        }

        /* Zebra Look Fix - Farben für die Zeilen */
        .tabulator-row {
            border-bottom: 1px solid #30363d !important;
            background-color: #161b22 !important; /* Odd rows */
            color: #c9d1d9 !important;
            transition: background 0.2s;
        }

        .tabulator-row.tabulator-row-even {
            background-color: #0d1117 !important; /* Even rows */
        }

        .tabulator-row :hover {
            box-shadow: 0 0 10px var(--primary);
            animation: glow 1s infinite alternate;
        }

@keyframes glow {
 0% {
   box-shadow: 0 0 5px var(--primary);
 }
 100% {
   box-shadow: 0 0 10px var(--primary);
 }
}

        .tabulator-cell {
            padding: 12px !important;
            border-right: 1px solid #30363d !important;
        }

        /* Facebook Links */
        a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

            a:hover {
            text-decoration: underline;
            text-shadow: 0 0 8px var(--primary);
        }

        /* Portal Name Column */
        .portalCol {
            font-family: 'Roboto Mono', monospace !important;
            color: #ffffff !important;
            font-size: 15px;
        }

                .portalCol:active {
            color: var(--primary) !important;
        }


        @media (max-width: 900px) {
            .search-info-wrapper { flex-direction: column; }
            .header-img { max-height: 80px; }
        }
    </style>
</head>

<body>

<div class="header-container">
    <img src="header.png" class="header-img" alt="Trainstation Network">
</div>

<div class="topbar">
    <p class="explanation-text">
        Join the Network
        <a href="https://m.me/oliver.garbrecht" target="_blank" class="messenger-inline-btn">📬 MESSAGE ME</a>
    </p>

    <div class="search-info-wrapper">
        <input id="search" placeholder="Filter Players or Portal Names...">
        
            <span style="color:var(--muted); font-size: 14px;">⚡ One-Click-Copy "Pixel Portal Name"</span>
        </div>
    </div>
</div>

<div id="table"></div>

<script>
// FUNKTIONEN BLEIBEN UNVERÄNDERT WIE GEWÜNSCHT
const sheetURL = "https://docs.google.com/spreadsheets/d/1cZNXQHDezV_W0maz0ufxbL1nVJfchSKNjlgDucwbtig/export?format=xlsx";
let table;

function loadData() {
    fetch(sheetURL)
    .then(res => res.arrayBuffer())
    .then(data => {
        const workbook = XLSX.read(data, {cellLinks: true});
        const sheet = workbook.Sheets[workbook.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, {header: 1, defval: ""});
        const headers = rows[0];
        const jsonData = [];

        for (let r = 1; r < rows.length; r++) {
            let rowObj = {};
            headers.forEach((header, c) => {
                rowObj[header] = rows[r][c];
                if (c === 1) {
                    const cellAddr = XLSX.utils.encode_cell({r: r, c: c});
                    const cell = sheet[cellAddr];
                    rowObj["fb_link"] = (cell && cell.l && cell.l.Target) ? cell.l.Target : "";
                }
            });
            jsonData.push(rowObj);
        }

        const columns = [
            { title: headers[0], field: headers[0], cssClass: "statusCol", hozAlign: "center", width: 80 },
            { 
                title: headers[1], 
                field: headers[1], 
                formatter: function(cell) {
                    const name = cell.getValue();
                    const link = cell.getData().fb_link;
                    if (!name) return "";
                    const url = link ? link : "https://www.facebook.com" + encodeURIComponent(name);
                    return `<a href="${url}" target="_blank">${name}</a>`;
                }
            },
            { 
                title: headers[2], 
                field: headers[2], 
                cssClass: "portalCol",
                cellClick: (e, cell) => {
                    navigator.clipboard.writeText(cell.getValue());
                    cell.getElement().style.color = "#00d1ff";
                    setTimeout(() => cell.getElement().style.color = "#fff", 500);
                }
            }
        ];

        headers.slice(3).forEach(col => columns.push({
            title: col,
            field: col,
            sorter: function(a, b) {
                function parseDate(val) {
                    if (!val) return 0;
                    val = val.replace("< ", "");
                    return new Date(val).getTime();
                }
                return parseDate(a) - parseDate(b);
            }
        }));

        if (!table) {
            table = new Tabulator("#table", { 
                data: jsonData, 
                columns: columns, 
                layout: "fitColumns",
                responsiveLayout: "collapse"
            });
        } else {
            table.replaceData(jsonData);
        }
    });
}

loadData();

document.getElementById("search").addEventListener("keyup", function() {
    let value = this.value.toLowerCase();
    table.setFilter(data =>
        Object.values(data).some(v => String(v).toLowerCase().includes(value))
    );
});
</script>
</body>
</html>
